<!doctype html>
<html lang="en" class="d-classic t-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Percent Calculator | Collin Linde</title>
    <meta
      name="description"
      content="Work out what share of a piece of text is made up of a given word or phrase."
    />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../prefs.js"></script>
  </head>
  <body>
    <div class="orb" id="orb" aria-hidden="true"></div>

    <header class="nav">
      <a class="nav-home" href="../../">clinde.me</a>
      <div class="nav-right">
        <nav class="nav-links" aria-label="Site">
          <a href="../../#projects">Projects</a>
        </nav>
        <button class="toggle" id="design-toggle" type="button" hidden></button>
        <button class="toggle toggle-icon" id="theme-toggle" type="button" hidden>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="page">
      <div class="page-inner">
        <h1>Text Percent Calculator</h1>
        <p class="page-intro">
          Paste some text and enter a word or phrase to see what share of the words it accounts
          for. Everything is calculated in your browser.
        </p>

        <div class="tool">
          <div class="panel">
            <label class="field">
              <span>Text</span>
              <textarea id="text" placeholder="Type or paste text here"></textarea>
            </label>
            <label class="field">
              <span>Word or phrase to look for</span>
              <input id="query" type="text" autocomplete="off" spellcheck="false" />
            </label>

            <div aria-live="polite">
              <p class="result" id="result">0%</p>
              <p class="result-detail" id="detail">Enter some text to get started.</p>
            </div>
            <p class="preview" id="preview" hidden></p>
          </div>

          <div class="panel">
            <h2>Most used words</h2>
            <p class="empty" id="freq-empty">Word counts appear here once you enter text.</p>
            <table class="freq" id="freq" hidden>
              <thead>
                <tr>
                  <th scope="col">Word</th>
                  <th scope="col" class="num">Count</th>
                  <th scope="col" class="num">Share</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script src="../../site.js"></script>
    <script src="text-percent.js"></script>
  </body>
</html>
